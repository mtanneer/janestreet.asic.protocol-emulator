name: update-copyright

on:
  push:
    branches: [main]
    paths: ["info.yaml"]
  schedule:
    # Yearly rollover, well clear of New Year's Day traffic.
    - cron: "0 6 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-copyright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-copyright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: python3 scripts/update_copyright.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- LICENSE; then
            echo "No copyright change, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "Update LICENSE copyright line (contributors/year)"
          git push
